version: v1
plugins:
  - plugin: go
    out: gen/go
    opt: paths=source_relative
  - plugin: go-grpc
    out: gen/go
    opt: paths=source_relative
  - plugin: grpc-gateway
    out: gen/go
    opt: paths=source_relative
  - plugin: openapiv2
    out: gen/openapiv2
    strategy: all
    opt:
      - allow_merge=true
      - merge_file_name=ui-gateway
      - json_names_for_fields=false
      - openapi_naming_strategy=fqn
