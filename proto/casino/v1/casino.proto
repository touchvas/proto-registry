syntax = "proto3";

// Messages of casino's two public APIs: player.proto (CasinoPublicService, the player gateway)
// and admin.proto (CasinoOperatorAdminService, the admin gateway). Both keep the package
// casino.v1, so the gRPC method names casino-service serves don't change. casino-service runs
// once per operator.
//
// Amounts are decimal strings. Every response carries status_code and status_description: a
// request the service refuses still answers HTTP 200, with the reason there; only transport
// failures are HTTP errors.
package casino.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/touchvas/proto-registry/gen/go/casino/v1;casinov1";

message EmptyRequest {}

message ProviderRequest { string provider_uuid = 1; }

message BrandProviderRequest {
  uint64 brand_id = 1;
  string provider_uuid = 2;
}

message BrandGameRequest {
  uint64 brand_id = 1;
  string game_uuid = 2;
}

message ListPublicProvidersRequest { uint64 brand_id = 1; }
message ListPublicCategoriesRequest { uint64 brand_id = 1; }

message ListPublicGamesRequest {
  uint64 brand_id = 1;
  string provider_uuid = 2;
  string category_uuid = 3;
  string search = 4;
  uint32 page = 5;
  uint32 per_page = 6;
}

message GetEffectiveGameLimitsRequest {
  uint64 brand_id = 1;
  string game_uuid = 2;
  string currency = 3;
}

message LaunchGameRequest {
  uint64 brand_id = 1;
  string game_uuid = 2;
  uint64 player_id = 3;
  string player_token = 4;
  string currency = 5;
  bool demo = 6;
  string country = 7;
  string language = 8;
  string device = 9;
}

message SyncProviderGamesRequest {
  string provider_uuid = 1;
  uint64 brand_id = 2;
  uint32 batch_size = 3;
}

message CreateBrandRequest {
  uint64 brand_id = 1;
  string name = 2;
  string status = 3;
}

message UpdateBrandRequest {
  uint64 brand_id = 1;
  string name = 2;
  string status = 3;
}

message AssignBrandProviderRequest {
  uint64 brand_id = 1;
  string provider_uuid = 2;
  google.protobuf.Struct provider_config = 3;
  string display_name = 4;
  string image_url = 5;
  uint32 priority = 6;
  string status = 7;
}

message UpdateBrandProviderRequest {
  uint64 brand_id = 1;
  string provider_uuid = 2;
  string display_name = 3;
  string image_url = 4;
  uint32 priority = 5;
  string status = 6;
}

message ConfigureTransactionRouteRequest {
  string base_url = 1;
  string authentication_key = 2;
  uint32 authentication_key_version = 3;
  string status = 4;
}

message CreateCategoryRequest {
  uint64 brand_id = 1;
  string name = 2;
  string image_url = 3;
  uint32 priority = 4;
  string status = 5;
}

message ListAdminCategoriesRequest { uint64 brand_id = 1; }

message UpdateCategoryRequest {
  uint64 brand_id = 1;
  string category_uuid = 2;
  string name = 3;
  string image_url = 4;
  uint32 priority = 5;
  string status = 6;
}

message ConfigureBrandGameRequest {
  uint64 brand_id = 1;
  string game_uuid = 2;
  string display_name = 3;
  string image_url = 4;
  uint32 priority = 5;
  repeated string category_uuids = 6;
  string status = 7;
}

message ListBrandGamesRequest {
  uint64 brand_id = 1;
  string provider_uuid = 2;
  string search = 3;
  uint32 page = 4;
  uint32 per_page = 5;
}

message GameLimitsInput {
  string minimum_stake = 1;
  string maximum_stake = 2;
  string maximum_win = 3;
  string status = 4;
}

message ConfigureOperatorLimitsRequest {
  string currency = 1;
  GameLimitsInput limits = 2;
}

message ConfigureBrandLimitsRequest {
  uint64 brand_id = 1;
  string currency = 2;
  GameLimitsInput limits = 3;
}

message ConfigureBrandGameLimitsRequest {
  uint64 brand_id = 1;
  string game_uuid = 2;
  string currency = 3;
  GameLimitsInput limits = 4;
}

message Brand {
  uint64 id = 1;
  string uuid = 2;
  uint64 operator_id = 3;
  uint64 brand_id = 4;
  string name = 5;
  string status = 6;
  string created_at = 7;
  string updated_at = 8;
}

message AvailableProvider {
  string uuid = 1;
  string name = 2;
  string environment = 3;
  string status = 4;
}

message Provider {
  uint64 id = 1;
  string uuid = 2;
  string name = 3;
  string image_url = 4;
  uint32 priority = 5;
  string status = 6;
  string created_at = 7;
  string updated_at = 8;
}

message BrandProviderAccount {
  uint64 id = 1;
  string provider_account_uuid = 2;
  uint64 operator_id = 3;
  uint64 brand_id = 4;
  uint64 provider_id = 5;
  string provider_uuid = 6;
  uint64 provider_endpoint_id = 7;
  string environment = 8;
  string display_name = 9;
  string image_url = 10;
  uint32 priority = 11;
  string status = 12;
}

message Game {
  uint64 id = 1;
  string uuid = 2;
  uint64 provider_id = 3;
  string provider_uuid = 4;
  uint64 provider_game_id = 5;
  string provider_game_uuid = 6;
  string name = 7;
  string thumbnail_url = 8;
  string metadata_json = 9;
  string provider_status = 10;
  string status = 11;
}

message Category {
  uint64 id = 1;
  string uuid = 2;
  uint64 operator_id = 3;
  uint64 brand_id = 4;
  string name = 5;
  string image_url = 6;
  uint32 priority = 7;
  string status = 8;
}

message BrandGame {
  Game game = 1;
  string display_name = 2;
  string image_url = 3;
  uint32 priority = 4;
  string brand_status = 5;
  repeated Category categories = 6;
}

message GameLimits {
  string currency = 1;
  string minimum_stake = 2;
  string maximum_stake = 3;
  string maximum_win = 4;
  string source = 5;
  string status = 6;
}

message SyncResult {
  string provider_uuid = 1;
  uint64 fetched_count = 2;
  bool completed = 3;
}

message LaunchResult {
  string launch_url = 1;
  string provider_uuid = 2;
}

message BrandGamePage {
  repeated BrandGame items = 1;
  uint32 page = 2;
  uint32 per_page = 3;
  uint64 total = 4;
}

message OperationResult { bool completed = 1; }

message BrandResponse { int32 status_code = 1; string status_description = 2; Brand data = 3; }
message BrandsResponse { int32 status_code = 1; string status_description = 2; repeated Brand data = 3; }
message AvailableProvidersResponse { int32 status_code = 1; string status_description = 2; repeated AvailableProvider data = 3; }
message ProvidersResponse { int32 status_code = 1; string status_description = 2; repeated Provider data = 3; }
message BrandProviderResponse { int32 status_code = 1; string status_description = 2; BrandProviderAccount data = 3; }
message GamesResponse { int32 status_code = 1; string status_description = 2; repeated Game data = 3; }
message CategoryResponse { int32 status_code = 1; string status_description = 2; Category data = 3; }
message CategoriesResponse { int32 status_code = 1; string status_description = 2; repeated Category data = 3; }
message BrandGameResponse { int32 status_code = 1; string status_description = 2; BrandGame data = 3; }
message BrandGamesResponse { int32 status_code = 1; string status_description = 2; BrandGamePage data = 3; }
message GameLimitsResponse { int32 status_code = 1; string status_description = 2; GameLimits data = 3; }
message SyncGamesResponse { int32 status_code = 1; string status_description = 2; SyncResult data = 3; }
message LaunchGameResponse { int32 status_code = 1; string status_description = 2; LaunchResult data = 3; }
message OperationResponse { int32 status_code = 1; string status_description = 2; OperationResult data = 3; }
