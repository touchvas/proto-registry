syntax = "proto3";

// Back-office identity API (see admin.proto): platform staff onboarding operators and their
// brands. Every RPC needs a SUPER_ADMIN session with operator:read; the brand is named in the
// path, so these never depend on the caller's host.
package identity.admin.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/touchvas/proto-registry/gen/go/identity/admin/v1;identityadminv1";

// PlatformService manages operators, brands, brand settings and brand domains.
service PlatformService {
  // CreateOperator creates an operator, the company that owns brands. 201.
  rpc CreateOperator(CreateOperatorRequest) returns (CreateOperatorResponse) {
    option (google.api.http) = {
      post: "/v1/platform/operators"
      body: "*"
      response_body: "operator"
    };
  }

  // ListOperators lists every operator.
  rpc ListOperators(ListOperatorsRequest) returns (ListOperatorsResponse) {
    option (google.api.http) = {
      get: "/v1/platform/operators"
      response_body: "operators"
    };
  }

  // GetOperator reads one operator.
  rpc GetOperator(GetOperatorRequest) returns (GetOperatorResponse) {
    option (google.api.http) = {
      get: "/v1/platform/operators/{id}"
      response_body: "operator"
    };
  }

  // OnboardBrand creates a brand (PENDING) with its settings. 201.
  rpc OnboardBrand(OnboardBrandRequest) returns (OnboardBrandResponse) {
    option (google.api.http) = {
      post: "/v1/platform/brands"
      body: "*"
      response_body: "brand"
    };
  }

  // ListBrands lists brands, optionally of one operator.
  rpc ListBrands(ListBrandsRequest) returns (ListBrandsResponse) {
    option (google.api.http) = {get: "/v1/platform/brands"};
  }

  // GetBrand reads one brand.
  rpc GetBrand(GetBrandRequest) returns (GetBrandResponse) {
    option (google.api.http) = {
      get: "/v1/platform/brands/{id}"
      response_body: "brand"
    };
  }

  // ActivateBrand makes a brand ACTIVE.
  rpc ActivateBrand(ActivateBrandRequest) returns (ActivateBrandResponse) {
    option (google.api.http) = {
      patch: "/v1/platform/brands/{id}/activate"
      response_body: "brand"
    };
  }

  // SuspendBrand makes a brand SUSPENDED.
  rpc SuspendBrand(SuspendBrandRequest) returns (SuspendBrandResponse) {
    option (google.api.http) = {
      patch: "/v1/platform/brands/{id}/suspend"
      body: "*"
      response_body: "brand"
    };
  }

  // GetBrandSettings reads a brand's settings.
  rpc GetBrandSettings(GetBrandSettingsRequest) returns (GetBrandSettingsResponse) {
    option (google.api.http) = {
      get: "/v1/platform/brands/{id}/settings"
      response_body: "settings"
    };
  }

  // UpdateBrandSettings replaces a brand's settings. The body is the whole settings object
  // with the version it was read at; a stale version is a conflict.
  rpc UpdateBrandSettings(UpdateBrandSettingsRequest) returns (UpdateBrandSettingsResponse) {
    option (google.api.http) = {
      put: "/v1/platform/brands/{id}/settings"
      body: "settings"
      response_body: "settings"
    };
  }

  // ListBrandDomains lists a brand's domains.
  rpc ListBrandDomains(ListBrandDomainsRequest) returns (ListBrandDomainsResponse) {
    option (google.api.http) = {
      get: "/v1/platform/brands/{id}/domains"
      response_body: "domains"
    };
  }

  // AddBrandDomain registers a domain the brand's sites or back office run on. 201.
  rpc AddBrandDomain(AddBrandDomainRequest) returns (AddBrandDomainResponse) {
    option (google.api.http) = {
      post: "/v1/platform/brands/{id}/domains"
      body: "*"
      response_body: "domain"
    };
  }

  // RemoveBrandDomain removes a domain. 204.
  rpc RemoveBrandDomain(RemoveBrandDomainRequest) returns (RemoveBrandDomainResponse) {
    option (google.api.http) = {delete: "/v1/platform/brands/{id}/domains/{domain_id}"};
  }
}

message Operator {
  string id = 1;
  string code = 2;
  string name = 3;
  string created_by = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// Brand is one operator's business in one country: the tenant.
message Brand {
  string id = 1;
  string operator_id = 2;
  string code = 3;
  string name = 4;
  string country_code = 5;
  string business_email = 6;
  string phone = 7;
  // PENDING, ACTIVE or SUSPENDED.
  string status = 8;
  string created_by = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message BrandSettings {
  string tenant_id = 1;
  string currency = 2;
  string language = 3;
  string timezone = 4;
  // OTP or DIRECT.
  string verification_mode = 5;
  int32 otp_length = 6;
  int32 otp_ttl_seconds = 7;
  int32 otp_max_attempts = 8;
  string referral_prefix = 9;
  int32 password_min_length = 10;
  int32 min_age_years = 11;
  bool kyc_required_to_play = 12;
  // A new login ends the player's other sessions.
  bool single_session = 13;
  // The version read; send it back on update.
  int32 version = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message BrandDomain {
  string id = 1;
  string tenant_id = 2;
  string host = 3;
  // PLAYER_SITE or BACK_OFFICE.
  string purpose = 4;
  bool is_active = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CreateOperatorRequest {
  string code = 1;
  string name = 2;
}

message CreateOperatorResponse {
  Operator operator = 1;
}

message ListOperatorsRequest {}

message ListOperatorsResponse {
  repeated Operator operators = 1;
}

message GetOperatorRequest {
  string id = 1;
}

message GetOperatorResponse {
  Operator operator = 1;
}

message OnboardBrandRequest {
  string operator_id = 1;
  string code = 2;
  string name = 3;
  string business_email = 4;
  string phone = 5;
  string country_code = 6;
  string currency = 7;
  string language = 8;
  string timezone = 9;
}

message OnboardBrandResponse {
  Brand brand = 1;
}

message ListBrandsRequest {
  string operator_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListBrandsResponse {
  repeated Brand data = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message GetBrandRequest {
  string id = 1;
}

message GetBrandResponse {
  Brand brand = 1;
}

message ActivateBrandRequest {
  string id = 1;
}

message ActivateBrandResponse {
  Brand brand = 1;
}

message SuspendBrandRequest {
  string id = 1;
  string reason = 2;
}

message SuspendBrandResponse {
  Brand brand = 1;
}

message GetBrandSettingsRequest {
  string id = 1;
}

message GetBrandSettingsResponse {
  BrandSettings settings = 1;
}

message UpdateBrandSettingsRequest {
  string id = 1;
  // The JSON body.
  BrandSettings settings = 2;
}

message UpdateBrandSettingsResponse {
  BrandSettings settings = 1;
}

message ListBrandDomainsRequest {
  string id = 1;
}

message ListBrandDomainsResponse {
  repeated BrandDomain domains = 1;
}

message AddBrandDomainRequest {
  string id = 1;
  string host = 2;
  // PLAYER_SITE or BACK_OFFICE.
  string purpose = 3;
}

message AddBrandDomainResponse {
  BrandDomain domain = 1;
}

message RemoveBrandDomainRequest {
  string id = 1;
  string domain_id = 2;
}

message RemoveBrandDomainResponse {}
