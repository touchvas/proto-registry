syntax = "proto3";

// Back-office identity API (see admin.proto): staff accounts, roles and permissions.
package identity.admin.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "identity/admin/v1/admin.proto";

option go_package = "github.com/touchvas/proto-registry/gen/go/identity/admin/v1;identityadminv1";

// UserService manages back-office users. Staff only see and manage users whose brands all
// lie within theirs, and can't grant more than they hold.
service UserService {
  // ListUsers lists back-office users. Needs admin_user:read.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/v1/admin/users"};
  }

  // CreateUser creates a back-office user. Needs admin_user:write. 201.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/v1/admin/users"
      body: "*"
      response_body: "user"
    };
  }

  // GetUser reads a back-office user. Needs admin_user:read.
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {
      get: "/v1/admin/users/{id}"
      response_body: "user"
    };
  }

  // UpdateUser changes the fields sent. Needs admin_user:write.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option (google.api.http) = {
      patch: "/v1/admin/users/{id}"
      body: "*"
      response_body: "user"
    };
  }

  // SetUserEnabled enables or disables a user; disabling ends their sessions. Needs
  // admin_user:write.
  rpc SetUserEnabled(SetUserEnabledRequest) returns (SetUserEnabledResponse) {
    option (google.api.http) = {
      patch: "/v1/admin/users/{id}/status"
      body: "*"
      response_body: "user"
    };
  }

  // ResetUserPassword sets another user's password and ends their sessions. Needs
  // admin_user:write. 204.
  rpc ResetUserPassword(ResetUserPasswordRequest) returns (ResetUserPasswordResponse) {
    option (google.api.http) = {
      put: "/v1/admin/users/{id}/password"
      body: "*"
    };
  }
}

// RoleService manages the operator's roles, built from the permission catalogue.
service RoleService {
  // ListPermissions lists the permission catalogue. Needs role:read.
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (google.api.http) = {
      get: "/v1/admin/permissions"
      response_body: "permissions"
    };
  }

  // ListRoles lists the system roles and the operator's custom roles. Needs role:read.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {
      get: "/v1/admin/roles"
      response_body: "roles"
    };
  }

  // CreateRole creates a custom role. Needs role:write. 201.
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (google.api.http) = {
      post: "/v1/admin/roles"
      body: "*"
      response_body: "role"
    };
  }

  // GetRole reads a role. Needs role:read.
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse) {
    option (google.api.http) = {
      get: "/v1/admin/roles/{id}"
      response_body: "role"
    };
  }

  // UpdateRole replaces a custom role's name, description and permissions. Needs role:write.
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (google.api.http) = {
      put: "/v1/admin/roles/{id}"
      body: "*"
      response_body: "role"
    };
  }

  // DeleteRole deletes a custom role no user holds. Needs role:write. 204.
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
    option (google.api.http) = {delete: "/v1/admin/roles/{id}"};
  }
}

message ListUsersRequest {
  string brand_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListUsersResponse {
  repeated Admin data = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message CreateUserRequest {
  string email = 1;
  string msisdn = 2;
  string first_name = 3;
  string last_name = 4;
  string password = 5;
  string role_id = 6;
  bool all_brands = 7;
  repeated string brand_ids = 8;
}

message CreateUserResponse {
  Admin user = 1;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  Admin user = 1;
}

message UpdateUserRequest {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string msisdn = 4;
  string role_id = 5;
  // Sent to change the user's brands; absent keeps them.
  optional bool all_brands = 6;
  // A JSON array of brand ids. Sent (even empty) to change the user's brands; absent keeps
  // them. A ListValue, because a repeated field can't tell empty from absent.
  google.protobuf.ListValue brand_ids = 7;
}

message UpdateUserResponse {
  Admin user = 1;
}

message SetUserEnabledRequest {
  string id = 1;
  bool enabled = 2;
}

message SetUserEnabledResponse {
  Admin user = 1;
}

message ResetUserPasswordRequest {
  string id = 1;
  string new_password = 2;
}

message ResetUserPasswordResponse {}

message Permission {
  // e.g. player:status.
  string code = 1;
  string module = 2;
  string action = 3;
  string description = 4;
  // False for platform-only permissions such as operator:write.
  bool operator_grantable = 5;
}

message Role {
  string id = 1;
  // Set on system roles (ADMIN).
  optional string code = 2;
  string name = 3;
  string description = 4;
  bool is_system = 5;
  repeated string permissions = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ListPermissionsRequest {}

message ListPermissionsResponse {
  repeated Permission permissions = 1;
}

message ListRolesRequest {}

message ListRolesResponse {
  repeated Role roles = 1;
}

message CreateRoleRequest {
  string name = 1;
  string description = 2;
  repeated string permissions = 3;
}

message CreateRoleResponse {
  Role role = 1;
}

message GetRoleRequest {
  string id = 1;
}

message GetRoleResponse {
  Role role = 1;
}

message UpdateRoleRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string permissions = 4;
}

message UpdateRoleResponse {
  Role role = 1;
}

message DeleteRoleRequest {
  string id = 1;
}

message DeleteRoleResponse {}
