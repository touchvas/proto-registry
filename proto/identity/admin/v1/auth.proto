syntax = "proto3";

// Back-office identity API (see admin.proto): logging in and out, and forgotten passwords.
package identity.admin.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "identity/admin/v1/admin.proto";
import "identity/v1/auth.proto";
import "identity/v1/player.proto";

option go_package = "github.com/touchvas/proto-registry/gen/go/identity/admin/v1;identityadminv1";

// AuthService starts and ends back-office sessions.
service AuthService {
  // Login checks an admin's password. An admin without a second factor gets a session; one
  // with a second factor gets a challenge that VerifyLogin completes.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/admin/login"
      body: "*"
    };
  }

  // VerifyLogin completes a login challenge with a TOTP or SMS code.
  rpc VerifyLogin(VerifyLoginRequest) returns (VerifyLoginResponse) {
    option (google.api.http) = {
      post: "/v1/admin/login/verify"
      body: "*"
    };
  }

  // ForgotPassword texts a 6-digit code to the admin's phone number. It answers the same for
  // unknown, disabled or phone-less accounts. 202, no body.
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse) {
    option (google.api.http) = {
      post: "/v1/admin/password/forgot"
      body: "*"
    };
  }

  // ResetPassword sets a new password with the texted code and ends every session. 204.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (google.api.http) = {
      post: "/v1/admin/password/reset"
      body: "*"
    };
  }

  // Logout ends the calling admin's session. 204.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {post: "/v1/admin/logout"};
  }

  // CreateChallenge returns a proof-of-work puzzle, as identity.v1.AuthService.CreateChallenge
  // does for the apps: the back office needs one when admin login answers 428 (suspicious
  // traffic, or attack mode on admin_login).
  rpc CreateChallenge(identity.v1.CreateChallengeRequest) returns (identity.v1.CreateChallengeResponse) {
    option (google.api.http) = {
      post: "/v1/challenge"
      body: "body"
      response_body: "challenge"
    };
  }
}

message LoginRequest {
  // One of email or msisdn.
  string email = 1;
  string msisdn = 2;
  string password = 3;
}

message LoginResponse {
  optional Admin admin = 1;
  optional identity.v1.IssuedSession session = 2;
  optional LoginChallenge challenge = 3;
}

// LoginChallenge asks for a second factor within five minutes, five tries at most.
message LoginChallenge {
  string challenge_id = 1;
  // TOTP or SMS.
  string method = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message VerifyLoginRequest {
  string challenge_id = 1;
  string code = 2;
}

message VerifyLoginResponse {
  optional Admin admin = 1;
  optional identity.v1.IssuedSession session = 2;
  optional LoginChallenge challenge = 3;
}

message ForgotPasswordRequest {
  string email = 1;
  string msisdn = 2;
}

message ForgotPasswordResponse {}

message ResetPasswordRequest {
  string email = 1;
  string msisdn = 2;
  string code = 3;
  string new_password = 4;
}

message ResetPasswordResponse {}

message LogoutRequest {}

message LogoutResponse {}
