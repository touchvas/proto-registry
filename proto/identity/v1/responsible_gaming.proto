syntax = "proto3";

// Public identity API (see player.proto): a player's own self-exclusion.
package identity.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/touchvas/proto-registry/gen/go/identity/v1;identityv1";

// ResponsibleGamingService lets players exclude themselves.
service ResponsibleGamingService {
  // SelfExclude creates the calling player's exclusion, or extends the open one to a later
  // end date. A start date of today applies at once and ends every session; a later one is
  // SCHEDULED. Needs a player session. 201.
  rpc SelfExclude(SelfExcludeRequest) returns (SelfExcludeResponse) {
    option (google.api.http) = {
      post: "/v1/profile/exclusion"
      body: "*"
    };
  }
}

message SelfExcludeRequest {
  // YYYY-MM-DD, whole days in the brand's timezone.
  string start_date = 1;
  string end_date = 2;
  string reason = 3;
}

message SelfExcludeResponse {
  SelfExclusion exclusion = 1;
  string message = 2;
}

message SelfExclusion {
  string id = 1;
  string player_id = 2;
  string reason = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5;
  // SCHEDULED, ACTIVE or ENDED.
  string status = 6;
  // PLAYER or ADMIN.
  string requested_by = 7;
  optional google.protobuf.Timestamp ended_at = 8;
  google.protobuf.Timestamp created_at = 9;
}
