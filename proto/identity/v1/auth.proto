syntax = "proto3";

// Public identity API (see player.proto): player login and logout, passwords, and the
// proof-of-work puzzles that suspicious clients must solve.
package identity.v1;

import "google/api/annotations.proto";
import "identity/v1/player.proto";

option go_package = "github.com/touchvas/proto-registry/gen/go/identity/v1;identityv1";

// AuthService starts and ends player sessions and manages player passwords.
service AuthService {
  // Login checks a player's password and starts a session. The player is identified by
  // exactly one of msisdn, email or username.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/login"
      body: "*"
    };
  }

  // Logout ends the calling player's session. Needs a player session. 204.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {post: "/v1/logout"};
  }

  // ForgotPassword texts a password-reset code. It answers the same whether or not the
  // number has an account. 202.
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse) {
    option (google.api.http) = {
      patch: "/v1/password/forgot"
      body: "*"
    };
  }

  // ResetPassword sets a new password with the texted code and ends every session.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (google.api.http) = {
      patch: "/v1/password/reset"
      body: "*"
    };
  }

  // ChangePassword changes the calling player's password and ends their other sessions.
  // Needs a player session. 204.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {
    option (google.api.http) = {
      patch: "/v1/profile/password"
      body: "*"
    };
  }

  // CreateChallenge returns a proof-of-work puzzle for an endpoint. Endpoints answer 428 when
  // the caller must solve one: find a nonce such that sha256(challenge + ":" + nonce) in hex
  // starts with difficulty zeros, then retry with X-PoW-Id (challenge_id) and X-PoW-Nonce.
  // A puzzle works once, for the same user agent, until it expires.
  rpc CreateChallenge(CreateChallengeRequest) returns (CreateChallengeResponse) {
    option (google.api.http) = {
      post: "/v1/challenge"
      body: "body"
      response_body: "challenge"
    };
  }
}

message LoginRequest {
  string msisdn = 1;
  string email = 2;
  string username = 3;
  string password = 4;
  // WEB, ANDROID, IOS, USSD, RETAIL or API.
  string channel = 5;
}

message LoginResponse {
  PlayerProfile player = 1;
  IssuedSession session = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message ForgotPasswordRequest {
  string msisdn = 1;
}

message ForgotPasswordResponse {
  string message = 1;
}

message ResetPasswordRequest {
  string msisdn = 1;
  string code = 2;
  string new_password = 3;
}

message ResetPasswordResponse {
  string message = 1;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message CreateChallengeRequest {
  // The endpoint the puzzle is for, from the query string (?endpoint=login): signup, login,
  // verify, resend, forgot, reset, admin_login, admin_forgot or admin_reset. When empty, the
  // body's endpoint is used, and then signup.
  string endpoint = 1;
  // The JSON body, which may name the endpoint instead.
  CreateChallengeBody body = 2;
}

message CreateChallengeBody {
  string endpoint = 1;
}

message CreateChallengeResponse {
  Challenge challenge = 1;
}

message Challenge {
  string endpoint = 1;
  string challenge_id = 2;
  string challenge = 3;
  // Leading zero hex digits a solution needs.
  int32 difficulty = 4;
  // Seconds until the puzzle expires.
  int32 expires_in = 5;
}
