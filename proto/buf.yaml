version: v1
# In v1, if buf.yaml is in the same folder as your protos,
# you don't need 'build'.
# If it's one level up, we use the directory as the module.
# googleapis provides google/api/annotations.proto, which maps RPCs to the REST paths
# api-gateway-service serves.
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - DEFAULT
  ignore_only:
    # The back office's /v1/challenge shares the player API's puzzle messages on purpose.
    RPC_REQUEST_RESPONSE_UNIQUE:
      - identity/v1/player.proto
      - identity/admin/v1/admin.proto
      # Sportsbook's player and admin services share response messages, under the names
      # sportsbook-service implements.
      - sportsbook/v1
      # Likewise casino's, under the names casino-service and casino-provider-service implement.
      - casino/v1
      - casino/provider/v1
    RPC_REQUEST_STANDARD_NAME:
      - sportsbook/v1
      - casino/v1
      - casino/provider/v1
    RPC_RESPONSE_STANDARD_NAME:
      - sportsbook/v1
      - casino/v1
      - casino/provider/v1
breaking:
  use:
    - FILE